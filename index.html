<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Store</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header>
      <!-- Logo -->

      <div class="logo">
        <img src="images/logo.png" alt="Book Store" />

        <h1>Book Store</h1>
      </div>

      <!-- Menu -->

      <nav>
        <ul>
          <li>
            <a href="index.html">Trang chủ</a>
          </li>

          <li>
            <a href="books.html">Danh mục</a>
          </li>

          <li>
            <a href="cart.html">Giỏ hàng</a>
          </li>

          <li>
            <a href="contact.html">Liên hệ</a>
          </li>
        </ul>
      </nav>

      <!-- Ô tìm kiếm -->

      <div class="search">
        <input type="text" placeholder="Tìm kiếm sách..." />
        
        <button>🔍</button>
      </div>
    </header>
<!-- ===========================
        BANNER
=========================== -->

<section class="slider">
  <div class="slides">
    <img src="images/banner1.jpg" class="slide active" alt="Banner 1" />
    <img src="images/banner2.jpg" class="slide" alt="Banner 2" />
    <img src="images/banner3.jpg" class="slide" alt="Banner 3" />
  </div>

  <!-- Nút trái -->
  <button class="prev" onclick="prevSlide()">❮</button>

  <!-- Nút phải -->
  <button class="next" onclick="nextSlide()">❯</button>
</section>

<!-- ==========================
        DANH MỤC
=========================== -->

<section class="category">
  <h2>Danh mục sách</h2>

  <div class="category-list">
    <div class="category-item">
      📖
      <p>Tiểu thuyết</p>
    </div>

    <div class="category-item">
      📚
      <p>Kỹ năng</p>
    </div>

    <div class="category-item">
      🎌
      <p>Manga</p>
    </div>

    <div class="category-item">
      👦
      <p>Thiếu nhi</p>
    </div>

    <div class="category-item">
      💼
      <p>Kinh tế</p>
    </div>

    <div class="category-item">
      ❤️
      <p>Ngôn tình</p>
    </div>
  </div>
</section>

<!-- ==========================
      SẢN PHẨM NỔI BẬT
=========================== -->

<section class="products">
  <h2>Sản phẩm nổi bật</h2>

  <div class="product-list">
    <!-- Sách 1 -->
    <div class="product">
      <img src="images/book1.jpg" alt="Đắc Nhân Tâm" />

      <h3>Đắc Nhân Tâm</h3>
      <p class="price">120.000đ</p>

      <button class="detail-btn">Xem chi tiết</button>
      <button class="cart-btn">Thêm vào giỏ</button>
    </div>

    <!-- Sách 2 -->
    <div class="product">
      <img src="images/book2.jpg" alt="Nhà Giả Kim" />

      <h3>Nhà Giả Kim</h3>
      <p class="price">135.000đ</p>

      <button class="detail-btn">Xem chi tiết</button>
      <button class="cart-btn">Thêm vào giỏ</button>
    </div>

    <!-- Sách 3 -->
    <div class="product">
      <img src="images/book3.jpg" alt="One Piece" />

      <h3>One Piece Tập 109</h3>
      <p class="price">95.000đ</p>

      <button class="detail-btn">Xem chi tiết</button>
      <button class="cart-btn">Thêm vào giỏ</button>
    </div>

    <!-- Sách 4 -->
    <div class="product">
      <img src="images/book4.jpg" alt="Conan" />
      
      <h3>Thám tử Conan</h3>
      <p class="price">40.000đ</p>
      
      <button class="detail-btn">Xem chi tiết</button>
      <button class="cart-btn">Thêm vào giỏ</button>
    </div>
  </div>
</section>

    
    <script src="js/main.js"></script>
  </body>
</html>
