<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh mục sách</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <div class="logo">📚 Book Store</div>

      <nav>
        <ul>
          <li><a href="index.html">Trang chủ</a></li>

          <li><a href="category.html">Danh mục</a></li>

          <li><a href="cart.html">Giỏ hàng</a></li>

          <li><a href="contact.html">Liên hệ</a></li>
        </ul>
      </nav>
    </header>

    <!-- TIÊU ĐỀ -->

    <section class="book">
      <h2>Danh mục sách</h2>

      <div class="book-list">
        <!-- Sách 1 -->

        <div class="card">
          <img src="images/book1.jpg" alt="Đắc Nhân Tâm" />

          <h3>Đắc Nhân Tâm</h3>

          <p>120.000đ</p>

          <button onclick="addToCart(1)">Thêm vào giỏ</button>
        </div>

        <!-- Sách 2 -->

        <div class="card">
          <img src="images/book2.jpg" alt="Nhà Giả Kim" />

          <h3>Nhà Giả Kim</h3>

          <p>135.000đ</p>

          <button onclick="addToCart(2)">Thêm vào giỏ</button>
        </div>

        <!-- Sách 3 -->

        <div class="card">
          <img src="images/book3.jpg" alt="Harry Potter" />

          <h3>Harry Potter</h3>

          <p>250.000đ</p>

          <button onclick="addToCart(3)">Thêm vào giỏ</button>
        </div>

        <!-- Truyện 1 -->

        <div class="card">
          <img src="images/manga1.jpg" alt="One Piece" />

          <h3>One Piece</h3>

          <p>95.000đ</p>

          <button onclick="addToCart(4)">Thêm vào giỏ</button>
        </div>

        <!-- Truyện 2 -->

        <div class="card">
          <img src="images/manga2.jpg" alt="Doraemon" />

          <h3>Doraemon</h3>

          <p>35.000đ</p>

          <button onclick="addToCart(5)">Thêm vào giỏ</button>
        </div>

        <!-- Truyện 3 -->

        <div class="card">
          <img src="images/manga3.jpg" alt="Conan" />

          <h3>Conan</h3>

          <p>40.000đ</p>

          <button onclick="addToCart(6)">Thêm vào giỏ</button>
        </div>
      </div>
    </section>

    <!-- FOOTER -->

    <footer>
      <p>© 2026 Book Store | Thiết kế bởi My Diễm</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
