<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Liên hệ</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header>
      <div class="logo">📚 Book Store</div>

      <nav>
        <ul>
          <li><a href="index.html">Trang chủ</a></li>

          <li><a href="category.html">Danh mục</a></li>

          <li><a href="cart.html">Giỏ hàng</a></li>

          <li><a href="contact.html">Liên hệ</a></li>
        </ul>
      </nav>
    </header>

    <!-- LIÊN HỆ -->

    <section class="contact">
      <div class="contact-info">
        <h2>Thông tin cửa hàng</h2>

        <p>
          <strong>Tên cửa hàng:</strong>

          Book Store
        </p>

        <p>
          <strong>Địa chỉ:</strong>

          123 Nguyễn Văn Linh, TP.HCM
        </p>

        <p>
          <strong>Điện thoại:</strong>

          0123 456 789
        </p>

        <p>
          <strong>Email:</strong>

          bookstore@gmail.com
        </p>

        <p>
          <strong>Giờ mở cửa:</strong>

          08:00 - 21:00
        </p>
      </div>

      <div class="contact-form">
        <h2>Gửi tin nhắn</h2>

        <form>
          <input type="text" placeholder="Họ và tên" />

          <input type="email" placeholder="Email" />

          <input type="text" placeholder="Tiêu đề" />

          <textarea rows="6" placeholder="Nhập nội dung..."></textarea>

          <button>Gửi</button>
        </form>
      </div>
    </section>

    <!-- FOOTER -->

    <footer>
      <p>© 2026 Book Store | Thiết kế bởi My Diễm</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
